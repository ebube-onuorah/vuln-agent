name: VulnPredictor CI

on:
  push:
    branches: [main]
    paths:
      - "vuln-agent/advanced_predictor/**"
      - ".github/workflows/vuln-predictor-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vuln-agent/advanced_predictor/**"

defaults:
  run:
    working-directory: vuln-agent

jobs:
  test:
    name: Python Tests (58 tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuln-agent/advanced_predictor/requirements.txt

      - name: Install dependencies
        run: pip install -r advanced_predictor/requirements.txt httpx pytest pytest-asyncio

      - name: Train models on sample data
        run: |
          python advanced_predictor/training/create_sample_data.py
          python advanced_predictor/training/train.py

      - name: Run tests
        run: pytest advanced_predictor/tests/ -v --tb=short

      - name: Upload test results
        if: always()
        run: pytest advanced_predictor/tests/ --co -q 2>/dev/null | tail -3

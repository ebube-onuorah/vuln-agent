[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vuln-predictor"
version = "1.0.0"
description = "ML-powered code vulnerability prediction from git diffs"
authors = [{ name = "Ebube Onuorah", email = "ebube@example.com" }]
license = { text = "MIT" }
readme = "../README_ADVANCED.md"
requires-python = ">=3.11"
keywords = ["security", "vulnerability", "machine-learning", "xgboost", "git", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.43.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/krkhead/vuln-agent"
Repository = "https://github.com/krkhead/vuln-agent"
"Bug Tracker" = "https://github.com/krkhead/vuln-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.setuptools.packages.find]
where = [".."]
include = ["advanced_predictor*"]

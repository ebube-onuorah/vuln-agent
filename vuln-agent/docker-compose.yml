version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Persist trained models between restarts
      - model_data:/app/advanced_predictor/training/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    environment:
      - PREDICTOR_API_URL=http://api:8000
      - PREDICTOR_API_KEY=${API_KEY:-}
    command: sh -c "npm install --silent && npm run dev"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_data:
